name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pin llama.cpp core to stable v0.1.2, keep our Swift UI changes
        run: |
          mkdir -p /tmp/swiftui-backup
          cp -R examples/llama.swiftui /tmp/swiftui-backup/
          git fetch --tags --force
          git checkout v0.1.2
          rm -rf examples/llama.swiftui
          cp -R /tmp/swiftui-backup/llama.swiftui examples/llama.swiftui

      - name: Build the llama.cpp xcframework (iOS 16.0, device only)
        run: |
          chmod +x build-xcframework.sh
          sed -i '' 's/IOS_MIN_OS_VERSION=16.4/IOS_MIN_OS_VERSION=16.0/' build-xcframework.sh
          ./build-xcframework.sh ios-device

      - name: Build llama.swiftui
        run: |
          xcodebuild \
            -project examples/llama.swiftui/llama.swiftui.xcodeproj \
            -scheme llama.swiftui \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=build-ios \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

      - name: Install ldid
        run: |
          brew install ldid

      - name: Apply increased memory entitlements
        run: |
          cat > entitlements.plist << 'EOL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.kernel.increased-memory-limit</key>
              <true/>
              <key>com.apple.developer.kernel.extended-virtual-addressing</key>
              <true/>
          </dict>
          </plist>
          EOL
          ldid -Sentitlements.plist examples/llama.swiftui/build-ios/llama.swiftui.app/llama.swiftui

      - name: List build output
        run: |
          find . -name "*.app" -type d

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r examples/llama.swiftui/build-ios/llama.swiftui.app Payload/
          zip -r llama-swiftui.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: llama-swiftui-ipa
          path: llama-swiftui.ipa
