name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - name: Create Env.xcconfig
        run: |
          mkdir -p ios/Config
          cat > ios/Config/Env.xcconfig << 'EOL'
          // This file contains environment-specific build settings.

          GOOGLE_WEB_CLIENT_ID = dummy-web-client-id.apps.googleusercontent.com
          REVERSED_GOOGLE_IOS_CLIENT_ID = com.googleusercontent.apps.dummy-ios-client-id

          EOL

      - name: Create dummy .env file
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com

          # PalsHub/Supabase Configuration
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com

          # App Configuration
          APP_URL=pocketpal://app

          # Feature Flags (true/false)
          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true

          # Google Sign-In Configuration
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      - name: Create dummy GoogleService-Info.plist
        run: |
          cat > ios/GoogleService-Info.plist << 'EOL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>dummy-client-id.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.dummy-client-id</string>
            <key>API_KEY</key>
            <string>dummy-api-key-for-ci-builds</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>ai.pocketpal</string>
            <key>PROJECT_ID</key>
            <string>dummy-project-for-ci</string>
            <key>STORAGE_BUCKET</key>
            <string>dummy-project-for-ci.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          EOL

      - run: cd ios && pod install

      - name: Archive
        run: |
          cd ios
          xcodebuild archive \
            -workspace PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -archivePath build/PocketPal.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COPY_PHASE_STRIP=NO \
            STRIP_INSTALLED_PRODUCT=NO \
            DEAD_CODE_STRIPPING=NO

      - name: Diagnose ImageLoader linkage
        run: |
          BINARY="ios/build/PocketPal.xcarchive/Products/Applications/PocketPal.app/PocketPal"
          echo "=== Binary exists? ==="
          ls -la "$BINARY" || echo "BINARY NOT FOUND AT EXPECTED PATH"
          echo ""
          echo "=== Searching binary for ImageLoader-related symbols/strings ==="
          strings "$BINARY" | grep -i "ImageLoader" || echo "NO 'ImageLoader' STRINGS FOUND IN BINARY AT ALL"
          echo ""
          echo "=== Searching for RCTImageLoader class symbol specifically ==="
          nm "$BINARY" 2>/dev/null | grep -i "RCTImageLoader" || echo "NO RCTImageLoader SYMBOL FOUND"

      - name: Package IPA
        run: |
          cd ios/build
          mkdir Payload
          cp -r PocketPal.xcarchive/Products/Applications/*.app Payload/
          zip -r PocketPal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPal-ipa
          path: ios/build/PocketPal.ipa
